name: Release macOS & Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Build self-contained ClaudeGate.app (arm64)
        run: |
          NODE_BIN="$(which node)"
          chmod +x scripts/build-app.sh
          bash scripts/build-app.sh --arch arm64 --bundle-node "${NODE_BIN}"
          build/ClaudeGate.app/Contents/Resources/runtime/node -e "import('node:sqlite').then(() => console.log('ARM64_SQLITE_OK'))"
          codesign --verify --deep --strict build/ClaudeGate.app

      - name: Package .dmg and .zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release-assets
          STAGE="$(mktemp -d)"
          cp -R build/ClaudeGate.app "${STAGE}/"
          ln -s /Applications "${STAGE}/Applications"
          hdiutil create -volname "ClaudeGate" -srcfolder "${STAGE}" -ov -format UDZO "release-assets/ClaudeGate-${VERSION}-macos-arm64.dmg"
          rm -rf "${STAGE}"
          ditto -c -k --sequesterRsrc --keepParent build/ClaudeGate.app "release-assets/ClaudeGate-${VERSION}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-assets
          path: release-assets/*

  build-macos-x64:
    name: Build macOS (Intel x64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Download Node.js darwin-x64 binary
        run: |
          NODE_VER="$(node -v)"
          curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-darwin-x64.tar.gz" -o node-x64.tar.gz
          tar -xzf node-x64.tar.gz
          echo "X64_NODE=$PWD/node-${NODE_VER}-darwin-x64/bin/node" >> "$GITHUB_ENV"

      - name: Build self-contained ClaudeGate.app (x86_64)
        run: |
          chmod +x scripts/build-app.sh
          bash scripts/build-app.sh --arch x86_64 --bundle-node "${X64_NODE}"
          file build/ClaudeGate.app/Contents/MacOS/ClaudeGate
          file build/ClaudeGate.app/Contents/Resources/runtime/node
          codesign --verify --deep --strict build/ClaudeGate.app

      - name: Package .dmg and .zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release-assets
          STAGE="$(mktemp -d)"
          cp -R build/ClaudeGate.app "${STAGE}/"
          ln -s /Applications "${STAGE}/Applications"
          hdiutil create -volname "ClaudeGate" -srcfolder "${STAGE}" -ov -format UDZO "release-assets/ClaudeGate-${VERSION}-macos-x64.dmg"
          rm -rf "${STAGE}"
          ditto -c -k --sequesterRsrc --keepParent build/ClaudeGate.app "release-assets/ClaudeGate-${VERSION}-macos-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-assets
          path: release-assets/*

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Build portable Windows Tray bundle
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-assets
          path: build/ClaudeGate-*-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true

      - name: Generate SHA256SUMS and publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cd release-bundle
          sha256sum ClaudeGate-* > SHA256SUMS.txt
          ls -lh

          cat > /tmp/release-notes.md <<EOF
          ## ClaudeGate ${TAG} (macOS & Windows)

          Self-contained desktop builds with bundled Node.js 22 runtime (no separate Node.js installation required).

          ### Downloads
          | Platform | Package | Notes |
          | :--- | :--- | :--- |
          | **macOS (Apple Silicon M1/M2/M3/M4)** | \`ClaudeGate-${VERSION}-macos-arm64.dmg\` / \`.zip\` | Native Swift Menu Bar App + bundled Node runtime |
          | **macOS (Intel x64)** | \`ClaudeGate-${VERSION}-macos-x64.dmg\` / \`.zip\` | Native Swift Menu Bar App + bundled Node runtime |
          | **Windows 10 / 11 (x64)** | \`ClaudeGate-${VERSION}-windows-x64.zip\` | Native System Tray App (\`ClaudeGate.exe\`) + bundled Node runtime |

          ### Highlights
          - **0-Byte Fail-Closed Proxy Gate** (\`127.0.0.1:17890\`, HTTP / HTTPS \`CONNECT\` / SOCKS5, Zero TLS MITM)
          - **Direct / Unproxied Traffic Alerts + Audible Sound**: Warns with native desktop alerts & sound when Clash is offline, switched to Direct, TUN + System Proxy are both off, exit IP is banned, or TUN leaks occur
          - **7-Probe Network Detector** (\`S\`–\`F\` IP purity, DNS leak, IPv6 leak, WebRTC UDP leak, Anthropic 3-endpoint checks)
          - **One-Click Clash Verge Rev Auto-Fixer** (\`rule\` mode, \`GLOBAL\`, node switch, 29 explicit rules in \`Script.js\`, \`ipv6: false\`)
          - **Cross-Platform System Proxy & Launch at Login**: \`networksetup\` / \`LaunchAgents\` on macOS; WinINet Registry + \`HKCU\\...\\Run\` on Windows

          > **macOS Gatekeeper Note**: Unsigned ad-hoc builds may prompt on first launch; run \`xattr -cr /Applications/ClaudeGate.app\` if macOS reports the app cannot be opened from an unidentified developer.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" * --clobber
            gh release edit "${TAG}" --title "ClaudeGate ${TAG} (macOS & Windows)" --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG}" * --title "ClaudeGate ${TAG} (macOS & Windows)" --notes-file /tmp/release-notes.md
          fi
